name: Validate blueprint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            ha: '2024.6.0'
            # Ceiling for the 2024.6.0 cell. Home Assistant 2026.11.0 requires josepy>=2.
            pip_extra: 'josepy<2'
          # 2026.11.0 requires Python >=3.14.2. The 3.14 spec installs the
          # current 3.14.x (3.14.10 on the hosted image that passed 2026.9.3).
          - python: '3.14'
            ha: '2026.11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install this cell's Home Assistant version
        env:
          HA_VERSION: ${{ matrix.ha }}
          PIP_EXTRA: ${{ matrix.pip_extra }}
        run: |
          args=(-r requirements-test.txt "homeassistant==${HA_VERSION}")
          if [ -n "${PIP_EXTRA}" ]; then
            args+=("${PIP_EXTRA}")
          fi
          python -m pip install "${args[@]}"
      - run: python -m pytest -q
