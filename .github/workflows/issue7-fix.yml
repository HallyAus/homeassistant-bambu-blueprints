name: Apply issue 7 fix

on:
  push:
    branches:
      - fix/notification-delay-issue-7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/notification-delay-issue-7
      - name: Apply minimal running-state guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('bambu_print_notify.yaml'),
              Path('blueprints/automation/danielhall/bambu_print_notify.yaml'),
          ]
          old = '''  - if:\n      - condition: template\n        value_template: "{{ trigger.id == 'progress_threshold' }}"\n    then:\n      - wait_for_trigger:\n'''
          new = '''  - if:\n      - condition: template\n        value_template: "{{ trigger.id == 'progress_threshold' }}"\n      - condition: state\n        entity_id: !input print_status_sensor\n        state: "running"\n    then:\n      - wait_for_trigger:\n'''

          for path in paths:
              text = path.read_text()
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'expected wait block not found in {path}')
                  text = text.replace(old, new, 1)
                  path.write_text(text)

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('blueprint copies diverged after patch')

          plan = Path('ISSUE7_FIX_PLAN.md')
          if plan.exists():
              plan.unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bambu_print_notify.yaml blueprints/automation/danielhall/bambu_print_notify.yaml ISSUE7_FIX_PLAN.md || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: avoid missed finish transition notification delay"
            git push origin HEAD:fix/notification-delay-issue-7
          fi
